# Cloudflare Pages · pyq-huanyan-org（国际站）
# CF Pages 不支持 wrangler.toml里的 [build] section
# Build 配置必须在 CF Dashboard UI 上设置

name = "pyq-huanyan-org"
compatibility_date = "2024-06-20"
pages_build_output_dir = "./vendor/quartz/public"

#部署流程：
#1. CF Dashboard → Pages → Connect to Git → soho1319/pyq-huanyan-org-web
#2. Build settings:
# Build command: bash build.sh
# Build output directory: vendor/quartz/public
#3. Environment variables (Plaintext):
# - SITE_URL = https://pyq.huanyan.org
# - SITE_NAME = 内容营销朋友圈小助手
# - FREE_TIER_DAILY_LIMIT =50
#4. Environment variables (Secret):
# - ANTHROPIC_API_KEY = sk-ant-xxx
# - OPENAI_API_KEY = sk-xxx
#5. Save and Deploy

#build.sh做了什么：
#1.临时 clone Quartz v4 → vendor/quartz/
#2. 把仓库根的 content/复制到 vendor/quartz/content/
#3. 把仓库根的 quartz.config.ts / components / functions复制到 Quartz
#4.装 npm依赖 +跑 npx quartz build
#5.产物输出到 vendor/quartz/public/ ← CF Pages读这个目录
