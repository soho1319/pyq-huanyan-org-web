name: Deploy to Cloudflare Pages + EdgeOne

"on":
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy-cf:
    name: Deploy to Cloudflare Pages (国际站)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run build.sh (clone Quartz + copy + npx quartz build)
        run: bash build.sh

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          projectName: pyq
          directory: vendor/quartz/public
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

  deploy-edgeone:
    name: Deploy to EdgeOne Pages (国内站)
    runs-on: ubuntu-latest
    needs: deploy-cf
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run build.sh
        run: bash build.sh

      - name: Install EdgeOne CLI
        run: npm install -g edgeone

      - name: Deploy to EdgeOne
        env:
          TENCENTCLOUD_SECRET_ID: ${{ secrets.TENCENTCLOUD_SECRET_ID }}
          TENCENTCLOUD_SECRET_KEY: ${{ secrets.TENCENTCLOUD_SECRET_KEY }}
        run: |
          cd vendor/quartz
          edgeone deploy

      - name: Notify on success
        if: success()
        run: echo "🎉 双站部署完成！https://pyq.huanyan.org"
